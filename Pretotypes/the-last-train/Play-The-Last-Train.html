"/server/heist/rules.js":function(module,exports,require){
const {roles, chapters, outcomes} = require('../../config/heist/content');
const tracks = ['Supply','Care','Cover'];
function validAction(a, focus) {
  return a && tracks.includes(a.track) && ['Safe','Bold'].includes(a.method) && typeof a.focus === 'boolean' && (!a.focus || (a.method === 'Bold' && focus === 1));
}
function resolveAction(action, role, roll) {
  if (!validAction(action,1)) throw new Error('Invalid action');
  const modifier = action.method === 'Bold' ? Number(role.track === action.track) + (action.focus ? 2 : 0) : 0;
  if (action.method === 'Bold' && (!Number.isInteger(roll) || roll < 1 || roll > 6)) throw new Error('Invalid die');
  const success = action.method === 'Safe' || roll + modifier >= 4;
  return {...action, roll:action.method === 'Bold' ? roll : null, modifier, threshold:4, success, contribution:success ? (action.method === 'Safe' ? 1 : 2) : 0, alert:success ? 0 : 1};
}
function resolveTracks(actions, q) {
  const totals = Object.fromEntries(tracks.map(t=>[t, actions.filter(a=>a.track === t).reduce((s,a)=>s+a.contribution,0)]));
  return {totals, delta:{Fuel:Number(totals.Supply>=q),Hope:Number(totals.Care>=q),Alert:-Number(totals.Cover>=q)}};
}
function resolveVote(votes, seats, captain, chapter) {
  const options = chapters[chapter].options.map(o=>o.id);
  const counts = Object.fromEntries(options.map(o=>[o,seats.filter(id=>votes[id]===o).length]));
  const max = Math.max(...Object.values(counts));
  if (!max) return chapters[chapter].default;
  const tied = options.filter(o=>counts[o]===max);
  if (tied.includes(votes[captain])) return votes[captain];
  return votes[seats.find(id=>tied.includes(votes[id]))];
}
function assignRoles(seats, ballots) {
  const remaining = [...seats], assigned = {};
  roles.slice(0,seats.length).forEach((r, ri)=> {
    const count = id=>Object.values(ballots).filter(b=>b[r.question]===id).length;
    const best = remaining.reduce((a,b)=>count(b)>count(a) ? b : a);
    assigned[best] = ri; remaining.splice(remaining.indexOf(best),1);
  });
  return assigned;
}
function applyChapterEffects(before, flags, choice, actions, q) {
  const nextFlags = {...flags};
  const track = resolveTracks(actions,q);
  const lines = [{label:'Bold failures',delta:{Alert:actions.reduce((s,a)=>s+a.alert,0)}},
    ...tracks.map((t,i)=>({label:`${t} ${track.totals[t]}/${q}${track.totals[t]>=q?' · threshold reached':''}`,delta:{[['Fuel','Hope','Alert'][i]]:Object.values(track.delta)[i]}}))];
  const effects = {Battery:{Fuel:2,Alert:1},Crank:{Hope:-1,Alert:-1},Tunnel:{Fuel:-1,Alert:-1},Signal:{Hope:1,Alert:1},Launch:{Hope:1,Alert:1},Service:{Alert:-1}};
  if (!effects[choice]) throw new Error('Unknown choice');
  lines.push({label:`Because you chose ${choice}`,delta:effects[choice]});
  let text = outcomes[choice];
  if (choice==='Battery') nextFlags.batteryTaken=true;
  if (choice==='Crank') nextFlags.stationLit=true;
  if (choice==='Tunnel' || choice==='Signal') nextFlags.route=choice.toLowerCase();
  if (choice==='Tunnel' && flags.batteryTaken) { lines.push({label:'Battery removed → ventilation failed',delta:{Hope:-1}}); text+=' The dead ventilation fans unsettle the passengers. Hope −1.'; }
  if (choice==='Signal' && flags.stationLit) { lines.push({label:'Lit station → reassuring signal',delta:{Hope:1}}); text+=' The platform lights answer your signal. Extra Hope +1.'; }
  const resources = Object.fromEntries(Object.entries(before).map(([k,v])=>[k,Math.max(0,Math.min(6,v+lines.reduce((s,l)=>s+(l.delta[k]||0),0)))]));
  return {before:{...before},resources,flags:nextFlags,choice,lines,totals:track.totals,text};
}
function computeEnding(r,choice) {
  const threshold = choice==='Launch'?3:2;
  if (r.Fuel<threshold) return {title:'Train Stalled',threshold,text:'The engine falls quiet. You all take shelter in the underground waiting room. The shared mission is unfinished. No one is left behind.'};
  const reasons=[];
  if (r.Hope<2) reasons.push('The crew leaves exhausted and shaken.');
  if (r.Alert>4) reasons.push('The wardens are close behind.');
  return {title:reasons.length?'Costly Escape':'Clean Escape',threshold,text:reasons.length?`Everyone gets away. ${reasons.join(' ')}`:'Everyone is aboard. The city lights fade behind you. You found a way out together.'};
}
function computeWish(role, pid, history, r) {
  return [()=>history.some(h=>h.actions.some(a=>a.playerId===pid&&a.track==='Supply'&&a.success)),
    ()=>history.some(h=>h.choice==='Service'),()=>history.some(h=>h.totals.Care>=h.q),
    ()=>history.some(h=>h.choice==='Tunnel'),()=>r.Fuel>=3,()=>r.Hope>=3][role]();

},

(function () {

  const STORAGE = 'last-train-offline-room-v1';
  const die = () => browserCrypto.randomInt(1, 7);
  window.LAST_TRAIN_OFFLINE = true;
  window.io = function () {
    let room = null;
    const listeners = new Map();
    const fire = (event, payload) => (listeners.get(event) || []).forEach(fn => fn(payload));
    function save() {
      try { sessionStorage.setItem(STORAGE, JSON.stringify({version:1, savedAt:Date.now(), room})); } catch { /* Some file:// browsers deny storage. Playing still works. */ }
    }
    function broadcast() {
      if (!room) return;
      save();
      fire('state', engine.view(room, 'p1'));
    }
    function restore() {
      let saved;
      try { saved = JSON.parse(sessionStorage.getItem(STORAGE)); } catch { return false; }
      if (!saved || saved.version !== 1 || !saved.room?.heist) return false;
      room = saved.room;
      const h = room.heist, elapsed = Math.max(0, Date.now() - saved.savedAt);

      if (h.deadlineAt !== null) h.deadlineAt += elapsed;

function options(voting=false){return `<div class="options">${state.chapter.options.map(o=>voting?`<button class="option ${state.vote===o.id?'selected':''}" data-event="heistVote" data-choice="${o.id}" aria-pressed="${state.vote===o.id}"><strong>${o.id}${state.vote===o.id?' ✓':''}</strong><span>${o.text}</span><span>${o.hint}</span></button>`:`<div class="card option"><strong>${o.id}</strong><span>${o.text}</span><span>${o.hint}</span></div>`).join('')}</div>`;}
function ready(text){return `<div class="actions">${button(state.ready?'Ready ✓':text,'heistReady',state.ready?'disabled':'')}</div>`;}
function draft(){const a=state.draft||{track:'Cover',method:'Safe',focus:false};return `<section class="card"><div class="eyebrow">YOUR CONTRIBUTION · PRIVATE UNTIL REVEAL</div><h3>How will you help?</h3><p class="small-text">Each track needs ${state.q} contributions. Supply → Fuel +1 · Care → Hope +1 · Cover → Alert −1.</p><div class="track-grid">${['Supply','Care','Cover'].map(t=>`<button class="${a.track===t?'selected':''}" data-track="${t}" aria-pressed="${a.track===t}">${t}<small>${state.role.track===t?'Your specialty · Bold +1':'Open to everyone'}</small></button>`).join('')}</div><div class="actions">${['Safe','Bold'].map(m=>`<button class="${a.method===m?'selected':''}" data-method="${m}" aria-pressed="${a.method===m}">${m}<br><small>${m==='Safe'?'Guaranteed · +1 contribution':'Roll 4+ · +2 contribution'}</small></button>`).join('')}</div><label class="toggle"><input id="focus" type="checkbox" ${a.focus?'checked':''} ${a.method==='Safe'||!state.focus?'disabled':''}> Use Focus (+2 to Bold) · ${state.focus} left</label><p class="small-text">${a.method==='Bold'?`Roll d6 ${state.role.track===a.track?'+1 specialty ':''}${a.focus?'+2 Focus ':''}≥4. A failed roll adds 1 Alert.`:'Safe always contributes 1. No die or Focus required.'}</p><div class="status-note">${state.draft?'Draft saved.':'Default: Safe / Cover.'} Can edit until voting ends.</div></section>`;}
function bill(b){if(!b)return '';return `<section class="card"><h3>Because you chose ${esc(b.choice)}…</h3><p>${esc(b.text)}</p><table class="ledger"><thead><tr><th>Resource ledger</th><th>Fuel</th><th>Hope</th><th>Alert</th></tr></thead><tbody><tr><td>Before this chapter</td>${['Fuel','Hope','Alert'].map(k=>`<td>${b.before[k]}</td>`).join('')}</tr>${b.lines.map(l=>`<tr><td>${esc(l.label)}</td>${['Fuel','Hope','Alert'].map(k=>`<td>${l.delta[k]>0?'+':''}${l.delta[k]||'—'}</td>`).join('')}</tr>`).join('')}<tr><td>After · bounded to 0–6</td>${['Fuel','Hope','Alert'].map(k=>`<td>${b.resources[k]}</td>`).join('')}</tr></tbody></table></section>`;}
function history(){return state.history.length?`<details class="card history" id="history"><summary>The journey so far · ${state.history.length} chapter${state.history.length>1?'s':''}</summary>${state.history.map(b=>bill(b)).join('')}</details>`:'';}
function screen(){const s=state;
  if(s.phase==='lobby')return `<div class="eyebrow">YOUR BOARDING PASS</div><h2>Leave together.</h2><p>Gather ${s.demo?'your bot crew':'3–6 friends'}. Each person needs a phone and a different piece of the story.</p><div class="card"><span class="eyebrow">${OFFLINE?'LOCAL DEMO · NOT A JOIN CODE':'ROOM CODE'}</span><div class="code">${s.code}</div><p class="small-text">${s.demo?'Demo crew · bots share scripted clues and follow predictable actions.':`Open <strong>${esc(lanUrl||location.origin)}</strong> on each phone, then enter this code.`}</p>${crew()}</div><div class="status-note">Read your secret / Talk together / Pick one action / Live with the result</div>${host()?button('All aboard →','heistStart',s.players.filter(p=>p.connected).length<3?'disabled':'','primary full'):'<p>Waiting for the host to begin.</p>'}`;
  if(s.phase==='casting')return `<div class="eyebrow">CAST THE CREW · 3 QUICK QUESTIONS</div><h2>Who’s who tonight?</h2><p>Pick someone for each question. Self-votes welcome. These are suggestions, not personality labels.</p>${s.questions.map((q,i)=>`<section class="card cast-question"><h3>${i+1}. ${q}</h3><div class="chips">${s.players.map(p=>`<button class="${s.ballot[i]===p.id?'selected':''}" data-event="heistCastVote" data-question="${i}" data-player="${p.id}" aria-pressed="${s.ballot[i]===p.id}">${esc(p.name)}</button>`).join('')}</div></section>`).join('')}<p class="status-note">Answers stay private. Casting closes when the timer ends.${s.demo?' Demo casting: 12 seconds.':''}</p>`;
  if(s.phase==='roles')return `<div class="eyebrow">MEET YOUR OTHER SELF</div><h2>You’re the ${s.role.name}.</h2><p>${s.role.track} Bold +1 · You can still choose any track.</p>${secret()}${crew()}<div class="card"><h3>Want to trade places?</h3><p class="small-text">One mutual swap per person. The whole role, secret and wish move together. Invitations expire after 10 seconds.</p>${s.swaps.map(x=>`<p>${x.to===s.you?`${name(x.from)} invited you to swap.`:`Waiting for ${name(x.to)}.`}</p>${x.to===s.you?button('Accept swap','heistSwapAccept',`data-player="${x.from}"`):''}`).join('')}<div class="chips">${s.canSwap&&!s.swaps.length?s.players.filter(p=>p.id!==s.you).map(p=>button(`Ask ${esc(p.name)}`,'heistSwapRequest',`data-player="${p.id}"`,'small')).join(''):''}</div></div>${ready('My role is ready →')}`;
  if(s.phase==='waiting')return `<h2>Keep the crew together.</h2><p>Fewer than three players are connected. The next chapter will wait. Rejoin on the original phone to keep your role.</p>${crew()}${host()?`<div class="actions">${button('End session early','heistEndEarly','','')}</div>`:''}`;
  if(s.phase==='ended')return `<h2>Session ended early.</h2><p>The adventure was not completed. You can gather the crew and try again.</p>${history()}${button('Back to the station','leave')}`;
  if(s.phase==='ending')return `<div class="ending"><div class="seal">✦</div><div class="eyebrow">THE END OF THIS JOURNEY</div><h2>${s.ending.title}</h2><p class="scene">${esc(s.ending.text)}</p><p class="small-text">${s.history.at(-1).choice}: Fuel needed ${s.ending.threshold}. Clean escape: Hope ≥2, Alert ≤4.</p></div><section class="card"><div class="eyebrow">YOUR PERSONAL SOUVENIR · PRIVATE</div><h3>${s.wish.achieved?'✦ Wish fulfilled':'A wish for another journey'}</h3><p>${esc(s.wish.text)}</p><p class="small-text">A memory, not a score. Your wish never changes the crew’s outcome.</p>${button(s.wish.public?'Wish shared ✓':'Reveal my wish','heistRevealWish',s.wish.public?'disabled':'','')}${s.publicWishes.map(w=>`<div class="row"><span>${name(w.playerId)} · ${esc(w.text)}</span><span>${w.achieved?'✦':'○'}</span></div>`).join('')}</section><h3>Your part in the story</h3>${s.memories.map((m,i)=>`<details class="card history"><summary>Chapter ${i+1} · ${m.action.track} / ${m.action.method}</summary><p>You knew: ${esc(m.clue)}</p><p>You did: ${m.action.track}, ${m.action.method}${m.action.auto?' (Auto)':''}. You contributed ${m.action.contribution}.</p><p>Together: ${m.totals[m.action.track]}/${m.q} on ${m.action.track}. ${m.totals[m.action.track]>=m.q?'The track benefit activated.':'The track threshold was not reached.'}</p></details>`).join('')}${history()}${host()?button('Download anonymous event log','export','','full'):''}<div class="card"><h3>Before you go…</h3><p>When did you need a friend’s information? Which choice changed the outcome? Would you play another role?</p></div>${button('A new journey →','leave','','primary full')}`;
  let intro=`<div class="chapter-nav">${[0,1,2].map(i=>`<span class="${i<=s.chapterIndex?'active':''}"></span>`).join('')}</div><div class="eyebrow">CHAPTER 0${s.chapterIndex+1} / 03 · ${s.chapter.subtitle.toUpperCase()}</div><h2>${s.chapter.title}</h2>`;
  if(s.phase==='chapter_end')return intro+bill(s.bill)+(host()?button('Next chapter →','heistAdvance','','primary full'):'<p>Waiting for the host to continue.</p>');
  if(s.phase==='resolve'){
    if(s.showTotals)return intro+`<div class="card"><h3>Every contribution counts.</h3>${Object.entries(s.totals).map(([t,n])=>`<div class="row"><span>${t}</span><strong>${n}/${s.q} ${n>=s.q?'✓':''}</strong></div>`).join('')}<p class="small-text">Each track can trigger once. Next: the crew’s decision and its consequences.</p></div>${advance('See the consequences →')}`;
    const r=s.reveals.at(-1);return intro+`<section class="card reveal"><div class="eyebrow">CREW REVEAL ${s.reveals.length} / ${s.players.length}</div><h2>${name(r.playerId)}</h2><p>${r.track} · ${r.method}${r.auto?' · Auto':''}${r.focus?' · Focus used':''}</p>${r.roll!==null?`<div class="die">${r.roll}</div><p>d6 ${r.roll} + ${r.modifier} modifier = ${r.roll+r.modifier}<br>Target ≥${r.threshold}</p>`:'<div class="big-number">✓</div><p>Safe action · automatic success</p>'}<h3 class="${r.success?'success':'error'}">${r.contribution} contribution${r.contribution!==1?'s':''}${r.alert?' · Alert +1':''}</h3><details class="history"><summary>Result details</summary><p class="small-text">${r.method==='Bold'?`Raw die: ${r.roll}. Specialty: ${s.players.find(p=>p.id===r.playerId).track===r.track?'+1':'0'}. Focus: ${r.focus?'+2':'0'}. Success threshold: 4.`:'Safe actions contribute 1 without rolling.'} This result is saved. Resources settle once, after every reveal.</p></details></section>${advance(s.reveals.length===s.players.length?'See track totals →':'Next crew member →')}`;
  }
  const previous=s.history.at(-1);intro+=previous?`<p class="status-note">Previously: ${previous.choice}. Fuel ${previous.before.Fuel} → ${previous.resources.Fuel}, Hope ${previous.before.Hope} → ${previous.resources.Hope}, Alert ${previous.before.Alert} → ${previous.resources.Alert}.${s.flags.route?` Route: ${s.flags.route}.`:''}</p>`:'';
  intro+=`<p class="scene">${s.chapter.scene}</p><p class="npc">${s.chapter.npc}</p>${secret()}`;
  if(s.phase==='briefing')return intro+`<div class="status-note">Read your clue. What might your friends need to know? Take at least 10 seconds.</div>${ready('I’ve read my clue →')}`;
  const botClues=s.botClues.map(b=>`<div class="bot-note"><strong>${name(b.playerId)} · SCRIPTED CLUE</strong><p>“${esc(b.text)}”</p></div>`).join('');
  if(s.phase==='planning')return intro+`<h3>Put your phones down. Talk it through.</h3><p class="small-text">Who can supply, care and cover? What do your clues change?</p>${botClues}${options()}${draft()}${ready('Ready to vote →')}`;
  return intro+`<h3>Choose together. Vote privately.</h3><p class="small-text">Captain: ${name(s.captainId)}. A tie follows their submitted vote; otherwise the earliest valid tied vote. No votes: ${['Battery','Tunnel','Service'][s.chapterIndex]}.</p>${options(true)}<p class="status-note">${s.vote?`Your vote: ${s.vote}. You can change it until time runs out.`:'Choose one route. Votes stay hidden until settlement.'}${s.demo?' Demo voting: 8 seconds.':''}</p><details class="history" id="action-edit"><summary>Edit your personal action</summary>${draft()}</details>`;
}
function advance(label){return host()?button(label,'heistAdvance','data-delay="true"','primary full'):'<p class="status-note">The host will reveal the next card.</p>';}
function render(){const phaseKey=state ? `${state.phase}:${state.chapterIndex}:${state.phaseId}` : 'home';const changed=phaseKey!==renderedPhase;renderedPhase=phaseKey;const open=[...app.querySelectorAll('details[open][id]')].map(e=>e.id);const oldFocus=document.activeElement?.id;app.innerHTML=state?`<div class="game"><div class="topline"><span>THE LAST TRAIN · <strong>${state.code}</strong>${state.demo?' · BOT DEMO':''}</span><span id="timer"></span></div>${!['lobby','casting','roles'].includes(state.phase)?resources():''}${screen()}</div>`:home();open.forEach(id=>{const e=document.getElementById(id);if(e)e.open=true;});if(oldFocus&&!changed)document.getElementById(oldFocus)?.focus();if(changed)window.scrollTo({top:0,behavior:'instant'});updateClock();}
function updateClock(){if(!state)return;const t=document.querySelector('#timer');const now=Date.now()+offset;if(t)t.textContent=state.paused?'Paused · waiting for crew':state.deadlineAt?`${Math.max(0,Math.ceil((state.deadlineAt-now)/1000))}s · ${state.phase}`:state.phase.replace('_',' ');app.querySelectorAll('[data-delay]').forEach(b=>{const left=Math.ceil((state.startedAt+4000-now)/1000);b.disabled=left>0;b.title=left>0?`Available in ${left}s`:'';});}
setInterval(updateClock,250);
function changeAction(patch){send('heistSetAction',{...(state.draft||{track:'Cover',method:'Safe',focus:false}),...patch});}
app.addEventListener('change',e=>{if(e.target.id==='focus')changeAction({focus:e.target.checked});});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='show-join'){document.querySelector('#join-area').hidden=false;document.querySelector('#code').focus();return;}
  if(b.dataset.track){changeAction({track:b.dataset.track});return;}
  if(b.dataset.method){changeAction({method:b.dataset.method,...(b.dataset.method==='Safe'?{focus:false}:{})});return;}
  const ev=b.dataset.event;if(!ev)return;
  if(['create','demo','join'].includes(ev)){
    const input=document.querySelector('#name'),n=input.value.trim();if(!n){input.focus();toast('Tell us your name first.');return;}
    if(ev==='join')send('join',{name:n,code:document.querySelector('#code').value});else send('create',{name:n,mode:'heist',demo:ev==='demo'});return;
  }
  if(ev==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(state.researchEvents,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='last-train-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
  if(ev==='leave'){forgetSession();if(OFFLINE)location.reload();else location.href='/';return;}
  const data={};if(b.dataset.player)data.playerId=b.dataset.player;if(b.dataset.question!==undefined)data.question=Number(b.dataset.question);if(b.dataset.choice)data.choice=b.dataset.choice;send(ev,data);
});
render();

</script></body></html>
